    <script>
      // Tema: boyamadan önce uygula (yanıp sönme yok). Varsayılan = gece.
      (function () {
        try {
          var pref = localStorage.getItem('snaps_theme') || 'dark';
          var t =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref;
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
